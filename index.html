<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: al momento usa il logo completo (src/assets/logo.png), che
         include anche la scritta "OLIVEWOODCREATION" incorporata nell'immagine.
         NOTA: a 16-32px (dimensione reale di una favicon nella tab del browser)
         il testo sarà illeggibile — il file funziona comunque, ma se in futuro
         sarà disponibile un logo.svg o un ritaglio dedicato con solo l'icona
         (l'albero), sarà preferibile usare quello al posto di questo PNG. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OliveWood Creations</title>

    <!-- Titolo e descrizione mostrati nell'anteprima quando il sito viene
         condiviso su social/chat, oltre a immagine di anteprima
         (Facebook, LinkedIn, WhatsApp, ecc. leggono i tag "og:*"; Twitter/X
         legge i tag "twitter:*", e richiede anche "twitter:card" per
         mostrare l'immagine in grande). "/src/assets/logo.png" viene
         elaborato da Vite come gli altri asset in src/ (stesso pattern già
         usato sopra per lo script principale).
         NOTA: una volta online, per la massima compatibilità con i crawler
         social conviene sostituire questo percorso con un URL assoluto
         (es. https://tuodominio.it/...), perché lo standard Open Graph
         richiede un URL assoluto per og:image. -->
    <meta property="og:title" content="OliveWood Creations" />
    <meta
      property="og:description"
      content="Oggetti in legno d'ulivo fatti a mano, un pezzo alla volta."
    />
    <meta property="og:image" content="/src/assets/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OliveWood Creations" />
    <meta name="twitter:image" content="/src/assets/logo.png" />

    <!-- Font Google usati in tutto il sito:
         - "Playfair Display" per i titoli (font-serif, look artigianale/elegante)
         - "Inter" per il testo corrente (font-sans, molto leggibile)
         - "Caveat" per i numeri decorativi e le note scritte a mano
           (font-hand, dà un tocco personale/umano ai dettagli) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
